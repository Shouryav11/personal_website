<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tristan Clousso Portfolio{% endblock %}</title>
  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:700|Raleway:400,500|Open+Sans:400,700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
  <!-- Sliding Navbar -->
  <nav class="sliding-navbar">
    <ul>
      <li><a href="{{ url_for('about') }}" class="nav-link">About Me</a></li>
      <li><a href="{{ url_for('work') }}" class="nav-link">Experience</a></li>
      <li><a href="{{ url_for('skills') }}" class="nav-link">Skills</a></li>
      <li><a href="{{ url_for('art') }}" class="nav-link">Art</a></li>
      <li><a href="{{ url_for('projects') }}" class="nav-link">Projects</a></li>
      <li><a href="{{ url_for('contact') }}" class="nav-link">Contact</a></li>
      <span class="nav-slider"></span>
    </ul>
  </nav>
<body class="{{ bg_class }}">
  <main id="content-area">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Contact: shouryav84@gmail.com &copy; 2025 shourya vemula<br>copyrights &copy; 2025</p>
  </footer>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
